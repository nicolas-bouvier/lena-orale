<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Apprendre l'allemand avec Selina : parcours, grammaire, cartes, et conversation à voix haute.">
<meta name="theme-color" content="#04346B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Selina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Deutsch mit Selina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout : une application de téléphone à la charte Gemelli (crème, bleu Gemelli, bleu nuit, or ; Cormorant Garamond pour les titres, Figtree pour le texte).
   Quatre onglets en bas (Accueil, Parcours, Mots, Réglages) ; l'accueil s'ouvre sur une carte bleu nuit avec Selina et la leçon du jour ;
   la séance est plein écran, comme une messagerie : Selina en haut, la conversation au milieu, la réponse en bas. Sur ordinateur, la même colonne, plus large. */
:root{
  --paper:#F7F2EA; --sheet:#FFFFFF; --sheet2:#F1EADC; --ink:#1C1A18; --muted:#6E6660; --line:#E6DFD2;
  --accent:#014A97; --accent-ink:#F3E4C4; --accent-soft:#E7EFF8; --night:#04346B;
  --hero:#04346B; --hero2:#014A97; --hero-ink:#F7F2EA; --hero-mute:#B9C9E2; --hero-gold:#E3C995; --hero-line:rgba(247,242,234,.16);
  --good:#2E7D7F; --good-soft:#E6F2F1; --bad:#C8643A; --bad-soft:#FBEDE4; --gold:#B8935A; --gold-soft:#F6EEDD;
  --der:#014A97; --die:#C8643A; --das:#2E7D7F;
  --stage:#F1EADC; --shadow:0 1px 2px rgba(28,26,24,.05),0 10px 30px rgba(28,26,24,.07); --bar:rgba(247,242,234,.92);
  --skin:#EFC6A2; --skin-shade:#D69E78; --hair:#3A2318; --hair-light:#5C3A2B; --eye:#1B1D2B; --iris:#3E8C5C; --white:#FFFDF8;
  --lip:#A2474B; --lip-light:#C9676C; --mouth:#6E2730; --blush:#E58C78; --sweater:#C8975A; --sweater-dark:#A97A43;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#06152A; --sheet:#102B50; --sheet2:#17386A; --ink:#F1ECE2; --muted:#A3B4CF; --line:#2B4F85;
    --accent:#E3C995; --accent-ink:#06152A; --accent-soft:#143561; --night:#04152B;
    --hero:#0E2A52; --hero2:#17386A; --hero-ink:#F7F2EA; --hero-mute:#A3B4CF; --hero-gold:#E3C995; --hero-line:rgba(247,242,234,.14);
    --good:#6CC0BE; --good-soft:#12343A; --bad:#E58C63; --bad-soft:#3A2219; --gold:#E3C995; --gold-soft:#3A3018;
    --der:#9DB7DA; --die:#E58C63; --das:#6CC0BE;
    --stage:#17386A; --shadow:0 1px 0 rgba(0,0,0,.25); --bar:rgba(6,21,42,.92);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#06152A; --sheet:#102B50; --sheet2:#17386A; --ink:#F1ECE2; --muted:#A3B4CF; --line:#2B4F85;
  --accent:#E3C995; --accent-ink:#06152A; --accent-soft:#143561; --night:#04152B;
  --hero:#0E2A52; --hero2:#17386A; --hero-ink:#F7F2EA; --hero-mute:#A3B4CF; --hero-gold:#E3C995; --hero-line:rgba(247,242,234,.14);
  --good:#6CC0BE; --good-soft:#12343A; --bad:#E58C63; --bad-soft:#3A2219; --gold:#E3C995; --gold-soft:#3A3018;
  --der:#9DB7DA; --die:#E58C63; --das:#6CC0BE;
    --stage:#17386A; --shadow:0 1px 0 rgba(0,0,0,.25); --bar:rgba(6,21,42,.92);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;font-variant-numeric:lining-nums;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.meta{font-size:.875rem;color:var(--muted)}
svg.i{width:22px;height:22px;flex:none}

/* Cadre de l'application */
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.top .hello{font-size:.9rem;color:var(--muted)}
.top h1{font-size:2rem;color:var(--ink)}
.top h1 em{font-style:italic;color:var(--accent)}
.streak{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:.95rem;white-space:nowrap}
.streak svg{width:18px;height:18px}
.streak small{font-weight:500;color:var(--muted);font-size:.78rem}
.page-title{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.page-title h1{font-size:2.3rem;color:var(--accent)}

/* Onglets du bas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:.68rem;white-space:nowrap;font-weight:600;min-height:54px;border-radius:14px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{position:relative}
.tab[aria-current="page"] span::after{content:"";position:absolute;left:50%;bottom:-5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}

/* Carte du jour (bleu nuit) */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 22px;color:var(--hero-ink);
  background:radial-gradient(120% 90% at 0% 0%,var(--hero2) 0%,var(--hero) 62%);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.hero-head{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center}
.hero .lena{width:104px;height:104px;--lena-bg:rgba(247,242,234,.12)}
.hero-say{position:relative;background:rgba(247,242,234,.1);border:1px solid var(--hero-line);border-radius:18px 18px 18px 6px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-say .de{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.15;color:var(--hero-ink)}
.hero-say .fr{font-size:.85rem;color:var(--hero-mute)}
.hero-say .play{position:absolute;right:8px;bottom:8px}
.hero .eyebrow{color:var(--hero-gold)}
.hero h2{font-size:2.3rem;color:var(--hero-ink);margin-top:4px}
.hero .goal{color:var(--hero-mute);font-size:.95rem;margin-top:6px}
.prog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--hero-mute);font-variant-numeric:lining-nums tabular-nums}
.prog .bar{flex:1;height:6px;border-radius:999px;background:rgba(247,242,234,.16);overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:999px;background:var(--hero-gold)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 26px;border-radius:999px;border:1px solid transparent;
  font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.3rem;line-height:1.1;background:var(--accent);color:var(--accent-ink);text-decoration:none;transition:transform .12s ease,background .15s}
.btn:hover{background:var(--night)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;flex:none}
.btn.gold{background:var(--hero-gold);color:#04346B}
.btn.gold:hover{background:#EED9AE}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-family:var(--f-body);font-style:normal;font-size:.95rem;font-weight:600;min-height:44px;padding:8px 18px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{min-height:40px;padding:6px 16px;font-size:1.05rem}
.ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--accent-soft);color:var(--accent);padding:0}
.ico:hover{filter:brightness(.96)}
.ico svg{width:19px;height:19px}
.ico.sm{width:34px;height:34px}
.ico.sm svg{width:16px;height:16px}
.ico.on-hero{background:rgba(247,242,234,.14);color:var(--hero-ink)}
.notice{border-radius:16px;padding:14px 16px;font-size:.92rem;color:var(--muted);background:var(--sheet);box-shadow:var(--shadow)}
.notice b{color:var(--ink)}

/* Chiffres du jour */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow)}
.strip div{padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.strip div+div{border-left:1px solid var(--line)}
.strip b{font-family:var(--f-display);font-size:2rem;line-height:1.05;color:var(--accent);font-variant-numeric:lining-nums tabular-nums}
.strip span{font-size:.78rem;color:var(--muted)}

/* Sections */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head h2{font-size:1.65rem;color:var(--accent)}
.card{background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.memo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.memo li{display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:start;font-size:.95rem}
.memo li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:.5em}

/* Conversation libre : cartes qui défilent */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.topic{flex:none;scroll-snap-align:start;width:150px;min-height:112px;padding:14px;border-radius:18px;border:0;background:var(--sheet);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;text-align:left;gap:10px}
.topic:hover{background:var(--accent-soft)}
.topic b{font-family:var(--f-display);font-size:1.35rem;font-weight:600;line-height:1.1;color:var(--accent)}
.topic small{color:var(--muted);font-size:.82rem}

/* Parcours : un chemin d'étapes */
.road{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:10px}
.road::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line)}
.stop{position:relative;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.dot{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;background:var(--paper);border:2px solid var(--line);color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.stop.done .dot{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.stop.done .dot svg{width:20px;height:20px}
.stop.next .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 6px var(--accent-soft)}
.stop-card{width:100%;text-align:left;border:0;background:var(--sheet);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stop-card .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stop-card b{font-weight:600}
.stop-card .de{font-family:var(--f-display);font-style:italic;font-size:1.15rem;color:var(--accent)}
.stop.next .stop-card{padding:16px;gap:6px}
.stop.next .stop-card b{font-size:1.05rem}
.stop.next .stop-card .de{font-size:1.5rem}
.stop.next .goal{font-size:.9rem;color:var(--muted)}
.stars{font-size:.95rem;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.go{align-self:flex-start;margin-top:6px}

/* Mots */
.words{display:flex;flex-direction:column;background:var(--sheet);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.word{display:flex;align-items:center;gap:12px;padding:10px 14px;min-width:0}
.word+.word{border-top:1px solid var(--line)}
.word .w{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.word .w b{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.word .w span{font-size:.85rem;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px}
.empty .lena{width:96px;height:96px}

/* Réglages */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:600;font-size:.92rem}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.field textarea{resize:vertical;min-height:84px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sheet2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 10px;min-height:40px;border-radius:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.facts li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border-radius:12px;padding:6px 6px 6px 12px;font-size:.92rem}
.facts .ico{background:transparent;color:var(--muted)}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap select{flex:1;min-width:0}
.voice-tip{font-size:.88rem;color:var(--muted);background:var(--gold-soft);border-radius:12px;padding:10px 12px}
.voice-tip b{color:var(--ink)}
.link{background:none;border:0;padding:6px 2px;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.danger{color:var(--bad)}

/* Selina */
.lena{display:block;overflow:visible;--lena-bg:var(--stage)}
.lena .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.lena .eye.r{animation-delay:.04s}
.lena .iris{transition:transform .35s ease}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.lena .mouth-closed{transition:opacity .1s}
.lena .mouth-open{opacity:0;transform-box:fill-box;transform-origin:center}
.lena[data-state="speaking"] .mouth-open{opacity:1;animation:talk .3s infinite alternate ease-in-out}
.lena[data-state="speaking"] .mouth-closed{opacity:0}
.lena[data-state="speaking"] .head{animation:sway 2.4s infinite ease-in-out}
.lena .ring{opacity:0;transform-box:fill-box;transform-origin:center}
.lena[data-state="speaking"] .ring{opacity:1;animation:ring 1.6s infinite ease-out}
@keyframes talk{0%{transform:scaleY(.25)}45%{transform:scaleY(.95)}100%{transform:scaleY(.45)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(1.4deg)}}
@keyframes ring{0%{transform:scale(.96);opacity:.9}100%{transform:scale(1.06);opacity:0}}
.lena .head{transform-box:view-box;transform-origin:100px 140px}
.lena-art .head{transform-origin:200px 300px}
.lena[data-state="thinking"] .iris{transform:translate(1.5px,-1.5px)}
.lena .dots{opacity:0}
.lena[data-state="thinking"] .dots{opacity:1}
.lena .dots circle{animation:dot 1.2s infinite ease-in-out}
.lena .dots circle:nth-child(2){animation-delay:.15s}
.lena .dots circle:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion: reduce){
  .lena .eye,.lena .head,.lena .dots circle,.lena .ring{animation:none!important}
  .lena[data-state="speaking"] .mouth-open{animation:none;transform:scaleY(.6)}
}

/* Selina en images (sourire, bouche entrouverte, yeux fermés) */
.lena.face{position:relative;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 3px var(--gold-l, #E3C995)}
.lena.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform:scale(1.25);transform-origin:50% 30%}
.lena.face .f-talk,.lena.face .f-blink{opacity:0}
.lena.face .f-blink{animation:faceblink 5.2s infinite}
@keyframes faceblink{0%,94.5%,100%{opacity:0}96%,97.5%{opacity:1}}
.lena.face[data-state="speaking"] .f-talk{animation:faceflap .38s infinite alternate ease-in-out}
@keyframes faceflap{0%{opacity:.1}100%{opacity:.9}}
.lena.face[data-state="speaking"] img{animation:facesway 2.4s infinite ease-in-out}
.lena.face[data-state="speaking"] .f-talk{animation:faceflap .38s infinite alternate ease-in-out,facesway 2.4s infinite ease-in-out}
@keyframes facesway{0%,100%{transform:scale(1.25) rotate(0)}50%{transform:scale(1.25) rotate(.8deg)}}
.lena.face .dots{position:absolute;right:8%;top:8%;display:flex;gap:3px;opacity:0}
.lena.face .dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:dot 1.2s infinite}
.lena.face[data-state="thinking"] .dots{opacity:1}
@media (prefers-reduced-motion: reduce){ .lena.face .f-blink,.lena.face .f-talk{animation:none!important} }

/* Séance */
.session{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.s-top{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 16px 6px}
.s-title{min-width:0;text-align:center;display:flex;flex-direction:column;line-height:1.2}
.s-title b{font-family:var(--f-display);font-size:1.25rem;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-title span{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-variant-numeric:lining-nums tabular-nums;color:var(--muted);font-size:.85rem;min-width:40px;text-align:right}
.s-prog{height:4px;margin:0 16px;border-radius:999px;background:var(--line);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .4s ease}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1080px;margin:0 auto}
.stage{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:14px;padding:10px 16px 8px}
.stage .lena{width:92px;height:92px}
.stage .who{display:flex;flex-direction:column;gap:0;min-width:0}
.stage .who h2{font-size:1.6rem;color:var(--accent)}
.status{font-size:.88rem;color:var(--muted);min-height:1.3em}
.status.go{color:var(--good);font-weight:700}
.status.err{color:var(--bad)}
.stage .acts{display:flex;gap:8px}
.convo{flex:1;min-height:0;display:flex;flex-direction:column}
.chat{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{max-width:min(540px,88%);display:flex;flex-direction:column;gap:6px}
.msg.lena-msg{align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.say{background:var(--sheet);border-radius:6px 20px 20px 20px;padding:12px 14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.say .de{font-size:1.1rem;line-height:1.4}
.say .fr{font-size:.88rem;color:var(--muted)}

const ARTG = {der:"m", die:"f", das:"n"};
function parseVocab(lvl, unitId, str){
  return str.split(/;\s*/).filter(Boolean).map(item => {
    const k = item.indexOf("="); let de = item.slice(0, k).trim(); const fr = item.slice(k + 1).trim();
    let g = null; const plural = de.endsWith("*"); if (plural) de = de.slice(0, -1);
    const m = de.match(/^(der|die|das) (.+)$/);
    if (m){ g = plural ? "p" : ARTG[m[1]]; de = m[2]; }
    let ch = null; const bar = fr.indexOf("|");
    if (bar >= 0){ let c = fr.slice(bar + 1).trim(); const cm = c.match(/^(der|die|das) (.+)$/); ch = cm ? {de:cm[2], g:ARTG[cm[1]]} : {de:c, g:null}; }
    return [lvl, unitId, de, bar >= 0 ? fr.slice(0, bar).trim() : fr, g, ch];
  });
}

}

const AUX = {haben:VERBS[1].f, sein:VERBS[0].f};
const perfekt = (v, p) => v.aux ? `${AUX[v.aux][p]} ${v.pp}` : null;

/* ---------- Progression : points, objectif du jour, rangs ---------- */
const RANKS = [
  {xp:0, de:"Neuling", fr:"Nouveau venu"},
  {xp:150, de:"Entdecker", fr:"Explorateur"},
  {xp:400, de:"Plauderer", fr:"Bavard"},
  {xp:800, de:"Kenner", fr:"Connaisseur"},
  {xp:1500, de:"Profi", fr:"Pro"},
  {xp:2500, de:"Meister", fr:"Maître"}
];
function rankOf(xp){
  let i = 0; RANKS.forEach((r, k) => { if (xp >= r.xp) i = k; });
  const cur = RANKS[i], nxt = RANKS[i+1] || null;
  return {cur, nxt, i, pct: nxt ? Math.round((xp - cur.xp) / (nxt.xp - cur.xp) * 100) : 100};
}
function xpToday(){ return state.days[todayStr()] || 0; }
let toastTimer = null;
function addXP(n){
  if (!n) return;
  const t = todayStr();
  if (state.streak.last !== t){ state.streak.count = state.streak.last === addDays(t,-1) ? state.streak.count + 1 : 1; state.streak.last = t; }
  const before = rankOf(state.xp).i;
  state.xp += n; state.days[t] = (state.days[t] || 0) + n;
  const keys = Object.keys(state.days).sort(); while (keys.length > 60) delete state.days[keys.shift()];
  const after = rankOf(state.xp);
  toast(after.i > before ? `Nouveau rang : ${after.cur.de} !` : `+${n} XP`);
}
function toast(text){
  let el = document.getElementById("toast");
  if (!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = text; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 1600);
}
function curLevel(){ return state.settings.level === "A2" ? "A2" : "A1"; }

function startBernQuiz(){
  const started = new Set(UNITS.filter(u => Object.keys(unitState(u.id).steps).length).map(u => u.id));
  let pool = Object.entries(BERN).filter(([u]) => started.has(u)).flatMap(([, l]) => l);
  if (pool.length < 10) pool = Object.values(BERN).flat();
  const all = Object.values(BERN).flat();
  const qs = shuffle(pool).slice(0, 10).map(([be, de, fr]) => {
    const others = shuffle(all.filter(x => x[2] !== fr)).slice(0, 2).map(x => x[2]);
    const opts = shuffle([fr, ...others]);
    return {text:be, opts, ans:opts.indexOf(fr), explain:`En allemand standard : ${de}`, say:null};
  });
  openDrill({mode:"quiz", kind:"bern", title:"Comprendre le bernois", qs, i:0, chosen:null, score:0, xp:0});
}

/* ---------- Progression dans les unités ---------- */
const unitState = id => state.units[id] || {steps:{}};
const stepDone = (id, k) => !!unitState(id).steps[k];
const unitValidated = id => !!unitState(id).validated;
/* La prochaine chose à faire dans un niveau : la première unité non validée, et dans celle-ci la première séance pas encore faite (le bilan en dernier) */
function nextStep(lvl = curLevel()){
  const u = unitsOf(lvl).find(x => !unitValidated(x.id));
  if (!u) return null;
  const k = STEPS.slice(0, 3).find(s => !stepDone(u.id, s)) || "bilan";
  return {unit:u, kind:k};
}
const validatedCount = lvl => unitsOf(lvl).filter(u => unitValidated(u.id)).length;
const startedUnits = lvl => unitsOf(lvl).filter(u => Object.keys(unitState(u.id).steps).length);
function revisionDue(){
  const lvl = curLevel();
  if (validatedCount(lvl) < 2) return false;
  return !state.lastRevision || state.lastRevision <= addDays(todayStr(), -7);
}
function testScore(results, n){
  const pts = results.slice(0, n).reduce((s, r) => s + (r === "correct" ? 1 : r === "partial" ? 0.5 : 0), 0);
  return Math.round(pts / n * 100);
}

/* ---------- La séance ---------- */
let sess = null, tick = null;
const sessEl = document.getElementById("session");

/* kind : decouvrir, pratiquer, situation, bilan (id = unité) ; revision, examen (id = niveau) ; libre (id = sujet) */
function startSession(kind, id){
  if (sampleState === "absent" || !KINDS[kind]) return;
  unlockSpeech();
  const unit = STEPS.includes(kind) ? UNITS.find(u => u.id === id) : null;
  const topic = kind === "libre" ? TOPICS.find(t => t.id === id) : null;
  const lvl = unit ? unit.lvl : (kind === "revision" || kind === "examen") ? id : curLevel();
  if (STEPS.includes(kind) && !unit || kind === "libre" && !topic) return;
  const K = KINDS[kind];
  sess = {kind, unit, topic, lvl, target:K.target, test:!!K.test, results:[], turns:[], log:[], n:0, start:Date.now(), busy:false, ctl:null, ended:false, error:null, phase:"talk", suggestions:[], recap:null, saved:false, asked:[], facts:[]};
  sessEl.innerHTML = sessionShell(); swiss(sessEl);
  sessEl.hidden = false; document.body.classList.add("locked");
  clearInterval(tick); tick = setInterval(updateTimer, 1000);
  sess.turns.push({role:"user", content:turnNote() + "\n(The learner has just opened the session. Greet them warmly" + (state.profile.name ? " by their first name" : "") + (sess.test ? ", explain in one short sentence how the test works, and ask the first question.)" : " and start.)")});
  callSelina();
}
function sessionTitle(){
  if (sess.unit) return `${sess.unit.fr} · ${KINDS[sess.kind].fr}`;
  if (sess.topic) return `Conversation libre · ${sess.topic.fr}`;
  return `${KINDS[sess.kind].fr} ${sess.lvl}`;
}
function sessionSub(){
  if (sess.unit) return `${sess.unit.lvl} · unité ${sess.unit.n} · séance ${STEPS.indexOf(sess.kind) + 1} sur 4`;
  if (sess.topic) return sess.topic.de;
  return sess.kind === "examen" ? `${sess.target} questions · réussi à ${KINDS.examen.pass} %` : "Les unités passées et vos points faibles";
}
function sessionShell(){
  return `
  <header class="s-top">
    <button class="ico" data-a="quit" aria-label="Terminer la séance">${ICON.close}</button>
    <div class="s-title"><b>${esc(sess.unit ? sess.unit.fr : sess.topic ? sess.topic.fr : KINDS[sess.kind].fr + " " + sess.lvl)}</b><span>${esc(sess.unit ? KINDS[sess.kind].fr + " · " + sessionSub() : sessionSub())}</span></div>
    <span class="timer" id="timer">0:00</span>
  </header>
  <div class="s-prog" aria-hidden="true"><i id="sprog"></i></div>
  <div class="s-body">
    <aside class="stage">
      ${lenaSVG()}
      <div class="who"><h2>Selina</h2><p class="status" id="status" aria-live="polite">Selina arrive…</p></div>
      <div class="acts"><button class="ico sm" data-a="replay" aria-label="Réécouter Selina">${ICON_SPEAK}</button><button class="ico sm" data-a="replay-slow" aria-label="Réécouter lentement">${ICON_SLOW}</button></div>
    </aside>
    <div class="convo" id="convo">
      <div class="chat" id="chat" aria-live="polite"></div>
      <footer class="s-input" id="input">
        <div class="suggest" id="suggest"></div>
        <form class="sayform" id="sayform">
          <textarea id="reply" rows="1" lang="de" enterkeyhint="send" placeholder="Antworte auf Deutsch…" aria-label="Votre réponse en allemand" autocomplete="off" autocapitalize="sentences"></textarea>
          <button class="send" type="submit" id="send" aria-label="Envoyer">${ICON.send}</button>
        </form>
        <div class="tools"><button class="tool" data-a="idk">${ICON.help}Je ne sais pas</button><button class="tool" data-a="tip">${ICON.mic}Parler au lieu d’écrire</button></div>
        <div class="tip" id="tip" hidden>
          <span><b>Dictez avec le micro du clavier :</b> touchez le champ, passez le clavier en <b>Deutsch</b> avec la touche globe, puis touchez le micro et parlez par phrases entières.</span>
          <span><b>Pas de « Deutsch » ?</b> Réglages › Général › Clavier › Claviers › Ajouter un clavier › Allemand. Et dans Réglages › Général › Clavier › Langues de dictée, cochez Deutsch.</span>
          <span><b>Mac :</b> appuyez deux fois sur la touche Fn ou sur la touche micro.</span>
        </div>
      </footer>
    </div>
  </div>`;
}
function updateTimer(){
  if (!sess) return;
  const s = Math.floor((Date.now()-sess.start)/1000);
  const el = document.getElementById("timer"); if (el) el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const p = document.getElementById("sprog"); if (p) p.style.width = (sess.ended || sess.phase === "recap" ? 100 : Math.min(96, Math.round(sess.n / sess.target * 100))) + "%";
}
function setStatus(text, cls){ const el = document.getElementById("status"); if (el){ el.textContent = text; el.className = "status" + (cls ? " " + cls : ""); } }
function sessLevel(){ return sess ? sess.lvl : curLevel(); }
function learnerProfile(){
  const p = state.profile;
  const lvl = sessLevel();
  const valid = unitsOf(lvl).filter(u => unitValidated(u.id)).map(u => `${u.n}. ${u.de}`).join("; ") || "none yet";
  const started = unitsOf(lvl).filter(u => !unitValidated(u.id) && Object.keys(unitState(u.id).steps).length).map(u => `${u.n}. ${u.de}`).join("; ") || "none";
  const known = state.words.slice(0, 80).map(w => w.de).join(", ") || "none yet";
  const mem = state.memory.slice(0, 6).join(" | ") || "nothing yet";
  const facts = (p.facts || []).slice(0, 15).join(" | ") || "nothing yet";
  return `- First name: ${p.name || "not known yet: ask for it ONCE at the start; once the learner has answered, never ask again"}
- About the learner (in their words): ${p.work || "-"}
- What the learner has already told you in earlier sessions: ${facts}
- ${lvl} units already validated: ${valid}
- ${lvl} units in progress: ${started}
- Words already met with you: ${known}
- Points to practise from earlier sessions: ${mem}`;
}

/* Le mode d'emploi de chaque type de séance */
const KIND_GUIDE = {
  decouvrir:`SESSION TYPE: DISCOVER (session 1 of 4 of this unit). A relaxed conversation through which you bring in the target expressions, one or two at a time, when the moment is right: use the new expression yourself in what you tell (about you, your day, your life in Munich), make its meaning clear from the context (the French translation helps), then invite the learner to use it. Build on the learner's answers. Over the session, bring in most of the target expressions, never as a list. The learner starts from zero and wants to understand WHY sentences are built this way: each time you use a grammar structure for the first time (a verb ending, the verb in second position, einen instead of ein, a separable verb…), fill "rule" with a very short explanation in French (a title and 1 or 2 simple sentences, with the example from your sentence). At most one "rule" per turn, and not every turn.`,
  pratiquer:`SESSION TYPE: PRACTISE (session 2 of 4). Still a real conversation, but steer it so that the learner has to use the target expressions again and again: follow-up questions on what they said, little "what if" situations ("Stell dir vor, …"), ask them to ask YOU questions. At most 2 new words. A short exercise only when the bracket note asks for one.`,
  situation:`SESSION TYPE: ROLE-PLAY (session 3 of 4). In your first turn, set the scene in one short sentence and say who you play, then start in character. Play the character like a real person would: small talk, reactions, a bit of humour, a small complication when the bracket note asks for it. Stay in character; corrections go only in "correction". At the end, step out of the role to congratulate.`,
  bilan:`SESSION TYPE: UNIT TEST (session 4 of 4). Ask exactly ${KINDS.bilan.target} short test questions, one per turn, covering the target expressions of the unit, with varied formats: answer a question, translate a short French sentence into German (give the French sentence), complete a sentence with a gap, react to a situation described in French. Do NOT help and do NOT give hints: "suggestions" is always [] and "exercise" is always null. After each learner answer, judge it in "testResult": "correct" (meaning and grammar right; ignore punctuation, capitalisation and dictation slips), "partial" (understandable, with one small mistake) or "wrong" (or no real answer). If it is not correct, fill "correction", then ask the next question. Keep your comments very short.`,
  revision:`SESSION TYPE: REVIEW. A relaxed catch-up conversation ("Wie war deine Woche?") that naturally brings back expressions from the units listed below and the learner's weak points ("Points to practise"). A short exercise only when the bracket note asks for one.`,
  examen:`SESSION TYPE: MOCK EXAM, in the style of the Goethe-Zertifikat. Exactly ${KINDS.examen.target} questions, one per turn, in four parts given by the bracket note: HÖREN (listening): put a short announcement, phone message or dialogue (2 to 4 sentences) in "audio" (it is only read aloud, never shown before the learner answers) and the question about it in "de". LESEN (reading): put a short text (a sign, an ad or a short e-mail, at most 40 words) at the start of "de", then the question. SCHREIBEN (writing): ask the learner to write 2 or 3 sentences (for example a short reply to a message). SPRECHEN (speaking): personal questions or a request to formulate. Do NOT help: "suggestions" is [] and "exercise" is null. After each answer, judge it in "testResult" ("correct", "partial" or "wrong"), with a "correction" if needed, then ask the next question.`,
  libre:`SESSION TYPE: FREE CONVERSATION. A natural, friendly conversation on the topic, like two friends over a coffee: share your own experiences, opinions and little stories, follow the learner's lead, let the conversation wander a little.`
};

function rules(){
  const lvl = sessLevel(), K = KINDS[sess.kind];
  let plan;
  if (sess.unit){
    const gr = grammarOf(sess.unit.id);
    plan = `${sess.unit.lvl} UNIT ${sess.unit.n} of ${unitsOf(sess.unit.lvl).length}: "${sess.unit.de}" (${sess.unit.fr}). Content: ${sess.unit.plan} Target expressions: ${sess.unit.words.join(" / ")}.`
      + (gr ? `\nGrammar point of this unit (the learner has a sheet on it, in French): "${gr.title}": ${gr.rule.map(r => r.replace(/<[^>]+>/g, "")).join(" ")}` : "");
  }
  else if (sess.topic) plan = `FREE CONVERSATION about "${sess.topic.de}" (${sess.topic.fr}). Stay at ${lvl} level, reuse what the learner already knows, and introduce 4 to 6 useful new words.`;
  else {
    const pool = sess.kind === "examen" ? unitsOf(lvl) : startedUnits(lvl);
    plan = `${sess.kind === "examen" ? "MOCK EXAM" : "REVIEW"} for level ${lvl}. Units covered: ${pool.map(u => `${u.n}. ${u.de} (${u.words.slice(0, 5).join(", ")})`).join("; ") || "the A1 basics"}.`;
  }
  return `You are Selina, 34, a warm, cheerful and curious German teacher. You grew up in Bern, studied in Munich, and now live in Bern again, in the Länggasse, with your cat Brezel. You go everywhere by Velo along the Aare, hike in the Bernese Oberland at weekends, love Italian food (pistachio gelato above all) and once spent a summer in Rome. The learner lives near Bern too. You give a short spoken session (5 to 10 minutes, about ${sess.target} learner turns) to an adult French speaker at CEFR level ${lvl}${lvl === "A1" ? " (beginner)" : " (elementary: knows the A1 basics)"}. Your German is read aloud by a speech synthesizer and shown on screen.

LEARNER
${learnerProfile()}

THIS SESSION
${plan}
${KIND_GUIDE[sess.kind]}

${isCH() ? `SWITZERLAND (the learner lives in the Bern region)
- Write Swiss Standard German (Schweizer Hochdeutsch): always "ss", never the letter eszett. Prefer the Swiss words: das Velo, das Billett, die Glace (ice cream), der Rahm, das Gipfeli, das Brötli, parkieren, das Spital, das Trottoir, der Lastwagen, Merci. Prices in Franken and Rappen.
- When the unit plan mentions Munich or Germany, set the scene in Bern or elsewhere in Switzerland instead (the Bahnhof Bern, the Aare, the Zytglogge, the Bundesplatz market, Migros, Coop, the SBB, BERNEXPO for a trade fair).
- Speak Standard German, never dialect, except in the field "bern" described below.
${sess.kind === "decouvrir" && bernOf(sess.unit && sess.unit.id).length ? `- In your LAST turn of this DISCOVER session only, fill "bern" with ONE expression from this list of Bernese expressions the learner will hear (copy it exactly, do not invent dialect): ${bernOf(sess.unit.id).map(([be, de, fr]) => `"${be}" = "${de}" (${fr})`).join("; ")}. Mention it in one short sentence in "de" (in Standard German).` : ""}

` : ""}HOW TO TALK (most important: this must feel like a real conversation, not a quiz)
- Each turn: (1) react to what the learner just said, like a real person who is interested (Echt? Ach so! Wie schön! Das klingt toll! Oh, schade!), (2) often add something about yourself or a little comment, (3) then go on with a natural follow-up that builds on THEIR answer, the question a real person would ask next.
- Follow the thread. Do not jump from one unrelated question to another; when you change subject, do it smoothly (Übrigens …, Apropos …).
- Sound spoken: interjections (Ach, Na, Genau, Stimmt, Hm), natural short forms (Wie geht's?, Gibt's …?), a little humour. No lists, and no teacher talk like "now we practise …" or "the next expression is …".
${lvl === "A1" ? "- Length: 2 to 4 short, simple sentences (each at most 12 words), present tense, common words." : "- Length: 3 to 5 simple sentences (each at most 15 words); you may use the Perfekt, modal verbs, weil and dass."}
- End with something easy to answer, usually one natural question (never two questions in a row).
- Teach inside the conversation: use the target expressions yourself and create chances for the learner to use them. When the learner makes a mistake, repeat their idea correctly in your reply (like a native speaker would), and fill "correction" only for a real mistake that matters (wrong word, word order, article, verb form), not every turn.
- Use "du" with the learner, except in a role-play that calls for "Sie".
- The bracket note on each learner message gives the step, whether to add an exercise, and when it is the last turn: follow it, but keep the conversation flowing. Weave in one point from "Points to practise" when it fits.
- The learner often answers by voice dictation, which can garble a beginner's German (wrong but similar-sounding words, sometimes French-looking words, e.g. "is high say" for "Ich heiße"). Read their message phonetically and guess what German they most likely said; answer that, and never count dictation slips, punctuation or capitalisation as mistakes. Only if you really cannot guess, ask kindly in one short sentence to repeat or to type it.
- If the learner writes in French or says they do not know${K.test ? " during a test: count it as wrong, give the answer in \"correction\" and go on" : ": help kindly, give the German sentence they could use (also in \"suggestions\") and invite them to try it"}.

MEMORY AND VARIETY (very important)
- Re-read the whole conversation before you answer. Never ask again for something the learner has already told you (name, city, job, tastes, family…), in this session or in earlier ones. Use what they told you: call them by their first name, refer back to their answers.
- The bracket note lists the questions you have already asked: never ask any of them again, even with other words.
- To practise a question the learner has already answered (for example "Wie heißt du?"), make them ASK it, or ask it about someone else (a colleague, a customer, a role-play character), never about the learner again.
- Never repeat a sentence you already said. Vary your reactions, and do not start two turns in a row with the same word.

OUTPUT: reply with only one JSON object and no other text:
{"audio": null or "a listening text, only for the HÖREN part of the mock exam", "de": "what you say, in German", "fr": "French translation of de", "correction": null or {"wrong": "the learner's wrong words", "right": "the correct German", "why": "very short explanation in French"}, "testResult": null or "correct" or "partial" or "wrong" (only in a test, about the learner's last answer), "suggestions": ["2 or 3 short, correct German answers the learner could give to your question"], "exercise": null or {"question": "the question, in French or very simple German", "options": ["a", "b", "c"], "answer": 0, "explain": "short explanation in French"}, "newWords": [{"de": "der Kaffee", "fr": "le café"}], "rule": null or {"title": "short title in French", "text": "1 or 2 simple sentences in French"} (only in DISCOVER sessions, when a grammar structure appears for the first time), "bern": null or {"be": "the Bernese expression, copied from the list", "de": "Standard German", "fr": "French"} (only when the instructions above ask for it), "learnerName": null or "the learner's first name if they just told it", "learnerFacts": ["new facts the learner just told you about themselves, short, in French, e.g. \"habite à Valence\" (often empty)"], "end": false}
Nouns in newWords always carry their article (der, die, das). newWords lists only expressions introduced in this turn and is often empty. When "end" is true, "suggestions" is empty.`;
}

function cleanReply(r){
  if (!r || typeof r !== "object" || typeof r.de !== "string" || !r.de.trim()) return null;
  let ex = null;
  if (r.exercise && typeof r.exercise === "object" && Array.isArray(r.exercise.options)){
    const opts = r.exercise.options.map(x => String(x)).filter(Boolean).slice(0, 4);
    const a = Number(r.exercise.answer);
    if (opts.length >= 2 && Number.isInteger(a) && a >= 0 && a < opts.length) ex = {question:String(r.exercise.question||""), options:opts, answer:a, explain:String(r.exercise.explain||""), chosen:null};
  }
  const c = r.correction && typeof r.correction === "object" && r.correction.right ? {wrong:String(r.correction.wrong||""), right:String(r.correction.right), why:String(r.correction.why||"")} : null;
  return {
    de:r.de.trim(), fr:typeof r.fr === "string" ? r.fr.trim() : "", correction:c, exercise:ex, end:r.end === true,
    suggestions:Array.isArray(r.suggestions) ? r.suggestions.filter(x => typeof x === "string" && x.trim()).map(x => x.trim()).slice(0, 3) : [],
    testResult:["correct","partial","wrong"].includes(r.testResult) ? r.testResult : null,
    bern:r.bern && typeof r.bern === "object" && typeof r.bern.be === "string" && r.bern.be.trim() ? {be:r.bern.be.trim(), de:String(r.bern.de || ""), fr:String(r.bern.fr || "")} : null,
    rule:r.rule && typeof r.rule === "object" && typeof r.rule.text === "string" && r.rule.text.trim() ? {title:String(r.rule.title || "La règle").trim(), text:r.rule.text.trim()} : null,
    audio:typeof r.audio === "string" && r.audio.trim() ? r.audio.trim() : null,
    learnerName:typeof r.learnerName === "string" && r.learnerName.trim() && r.learnerName.trim().length <= 40 ? r.learnerName.trim() : null,
    learnerFacts:Array.isArray(r.learnerFacts) ? r.learnerFacts.filter(x => typeof x === "string" && x.trim()).map(x => x.trim().slice(0, 120)).slice(0, 5) : [],
    newWords:Array.isArray(r.newWords) ? r.newWords.filter(w => w && typeof w.de === "string" && w.de.trim()).map(w => ({de:w.de.trim(), fr:String(w.fr||"").trim()})).slice(0, 8) : []
  };
}

async function callSelina(){
  if (!sess || !sampleFn) return;
  sess.busy = true; sess.error = null; sess.suggestions = [];
  setSelina("thinking"); setStatus("Selina réfléchit…"); renderChat(); renderSuggest(); lockInput(true);
  const ctl = new AbortController(); sess.ctl = ctl;
  const mine = sess;
  let early = null, earlyDone = false;
  const onText = ({text}) => {
    if (early !== null || sess !== mine || sess.kind === "examen") return;
    const m = text.match(/"de"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if (!m) return;
    try { early = JSON.parse('"' + m[1] + '"').trim(); } catch(e) { early = ""; }
    if (!early) return;
    sess.preview = early; renderChat();
    setStatus("Selina parle…");
    speak(early, {onend: () => { earlyDone = true; if (sess === mine && !sess.busy) afterSelinaSpoke(); }});
  };
  try {
    const raw = await sampleFn.json([{role:"user", content:rules()}, ...sess.turns], {modelTier:"quick", cache:false, signal:ctl.signal, onText});
    if (sess !== mine) return;
    sess.preview = null;
    const r = cleanReply(raw);
    if (!r) throw {code:"invalid_json"};
    if (sess.test){
      r.suggestions = []; r.exercise = null;
      if (sess.n >= 1 && sess.results[sess.n - 1] === undefined) sess.results[sess.n - 1] = r.testResult || "wrong";
      if (sess.n >= sess.target) r.end = true;
    }
    sess.turns.push({role:"assistant", content:JSON.stringify({audio:r.audio, de:r.de, exercise:r.exercise ? {question:r.exercise.question, options:r.exercise.options} : null, testResult:r.testResult, end:r.end})});
    rememberSelina(r);
    if (r.correction){ const last = [...sess.log].reverse().find(m => m.t === "me"); if (last) last.correction = r.correction; }
    sess.log.push({t:"lena", d:r, fr:state.settings.showFr && !sess.test});
    r.newWords.forEach(addWord);
    sess.suggestions = r.suggestions;
    sess.busy = false;
    if (r.end) sess.ended = true;
    renderChat(); renderSuggest(); lockInput(false);
    if (early && early === r.de){ if (earlyDone || !("speechSynthesis" in window) || !voices.length) afterSelinaSpoke(); }
    else {
      setStatus("Selina parle…");
      speak(r.audio ? r.audio + " … " + r.de : r.de, {onend: () => { if (sess === mine) afterSelinaSpoke(); }});
      if (!("speechSynthesis" in window) || !voices.length) afterSelinaSpoke();
    }
  } catch(e){
    if (sess !== mine) return;
    sess.busy = false; sess.preview = null;
    if (e && e.code === "cancelled") return;
    const code = e && e.code;
    sess.error = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)
      ? {msg:"Selina ne peut pas répondre : la clé Google manque.", retry:false}
      : code === "bad_key" ? {msg:"La clé Google n’est pas acceptée : vérifiez-la dans Réglages.", retry:false}
      : code === "rate_limited" ? {msg:"Trop de messages d’un coup, ou limite d’utilisation atteinte. Réessayez dans un moment.", retry:true}
      : code === "session_expired" ? {msg:"La connexion a expiré : réessayez.", retry:true}
      : {msg:"Selina n’a pas compris la réponse reçue. Redemandez-lui.", retry:true};
    if (sess.error && !sess.error.retry && code !== "bad_key") { sampleState = "absent"; }
    setSelina("idle"); setStatus("Pas de réponse", "err"); renderChat(); lockInput(false);
  }
}
function afterSelinaSpoke(){
  if (!sess || sess.busy) return;
  if (sess.ended){ setStatus("Séance terminée", "go"); renderChat(); return; }
  setStatus("À vous !", "go");
  setSelina("idle");
}
function lockInput(on){
  const b = document.getElementById("send"); if (b) b.disabled = on || !sess || sess.ended;
  const t = document.getElementById("reply"); if (t) t.disabled = !sess || sess.ended;
}
/* Ce que Selina a déjà demandé et ce que l'apprenant a déjà dit : rappelé à chaque tour pour qu'elle ne se répète pas */
function rememberSelina(r){
  const qs = r.de.match(/[^.!?]*\?/g) || [];
  qs.map(q => q.trim()).filter(Boolean).forEach(q => { if (!sess.asked.includes(q)) sess.asked.push(q); });
  let changed = false;
  if (r.learnerName && !state.profile.name){ state.profile.name = r.learnerName; changed = true; }
  const facts = state.profile.facts || (state.profile.facts = []);
  r.learnerFacts.forEach(f => { if (!facts.some(x => x.toLowerCase() === f.toLowerCase())){ facts.unshift(f); sess.facts.push(f); changed = true; } });
  if (facts.length > 20) facts.length = 20;
  if (changed) touch();
}
function turnNote(){
  const n = sess.n, T = sess.target, K = sess.kind;
  const known = [state.profile.name ? "first name: " + state.profile.name : "", ...sess.facts].filter(Boolean).join("; ") || "nothing yet";
  const asked = sess.asked.slice(-12).join(" / ") || "none";
  const head = n === 0 ? `[start of the session · ${T} learner turns planned` : `[learner turn ${n} of ${T} · ${elapsedMin()} min`;
  if (sess.test){
    const part = q => K !== "examen" ? "" : ` (part ${q <= 3 ? "HÖREN: use \"audio\"" : q <= 6 ? "LESEN" : q <= 8 ? "SCHREIBEN" : "SPRECHEN"})`;
    if (n === 0) return `${head} · ask test question 1 of ${T}${part(1)} · the learner already told you: ${known}]`;
    if (n >= T) return `${head} · this was the LAST answer: judge it in testResult, then say the test is over (the app shows the score), say goodbye warmly and set end to true]`;
    return `${head} · judge this answer in testResult, correct it if needed, then ask test question ${n + 1} of ${T}${part(n + 1)} · questions already asked: ${asked}]`;
  }
  const last = n >= T || (Date.now() - sess.start) >= 9 * 60000;
  let step, exDue = false;
  if (last) step = "wrap-up (LAST TURN)";
  else if (K === "decouvrir") step = n === 0 ? "greet, a little small talk, then bring in the first target expression naturally" : "keep the conversation going; bring in another target expression when the moment is right";
  else if (K === "pratiquer"){ step = n === 0 ? "greet briefly and start a conversation where the learner needs the target expressions" : "keep the conversation going so the learner uses the target expressions"; exDue = n >= 3 && n % 3 === 0; }
  else if (K === "situation") step = n === 0 ? "set the scene in one sentence and start the role-play in character" : n === 5 ? "continue the role-play and add a small complication" : "continue the role-play, stay in character";
  else if (K === "revision"){ step = n === 0 ? "a friendly catch-up to start" : "keep chatting and bring back expressions from the units and the weak points"; exDue = n >= 3 && n % 4 === 0; }
  else step = n === 0 ? "greet and start the conversation on the topic" : "keep the conversation going";
  return `${head} · step: ${step} · ${exDue ? "add a mini exercise in this turn" : "no exercise this turn"}${last ? " · this is the last turn: wrap up and set end to true" : ""} · the learner already told you: ${known} · questions you already asked (do not ask them again): ${asked}]`;
}
function addWord(w){
  const key = w.de.toLowerCase();
  if (state.words.some(x => x.de.toLowerCase() === key)) return;
  state.words.unshift({de:w.de, fr:w.fr, d:todayStr()});
  if (state.words.length > 500) state.words.length = 500;
}

function elapsedMin(){ return Math.max(0, Math.round((Date.now() - sess.start)/60000)); }
function sendReply(text){
  text = String(text||"").trim();
  if (!sess || sess.busy || sess.ended || !text) return;
  speakToken++; try { speechSynthesis.cancel(); } catch(e) {}
  sess.n++;
  sess.log.push({t:"me", text, correction:null});
  sess.turns.push({role:"user", content:`${turnNote()}\n${text}`});
  const t = document.getElementById("reply"); if (t){ t.value = ""; t.style.height = ""; }
  callSelina();
}
function answerExercise(i, k){
  const m = sess && sess.log[i]; if (!m || !m.d.exercise || m.d.exercise.chosen !== null || sess.busy) return;
  const ex = m.d.exercise; ex.chosen = k;
  const ok = k === ex.answer;
  renderChat();
  sess.turns.push({role:"user", content:`[exercise answer, ${elapsedMin()} min elapsed] The learner chose "${ex.options[k]}": ${ok ? "correct" : `wrong, the right answer was "${ex.options[ex.answer]}"`}. React in one short sentence and continue the lesson with something new. No exercise this turn. Questions you already asked (never ask them again): ${sess.asked.slice(-12).join(" / ") || "none"}`});
  setTimeout(callSelina, 900);
}

/* ---------- Bilan ---------- */
function transcript(){
  return sess.log.map(m => {
    if (m.t === "me") return `Learner: ${m.text}` + (m.correction ? `\n  (correction: "${m.correction.wrong}" → "${m.correction.right}")` : "");
    let s = `Selina: ${m.d.de}`;
    if (m.d.exercise){ const e = m.d.exercise; s += `\n  (exercise: ${e.question} → ${e.chosen === null ? "not answered" : e.chosen === e.answer ? "correct" : "wrong"})`; }
    return s;
  }).join("\n");
}
async function openRecap(){
  if (!sess) return;
  if (sess.ctl) sess.ctl.abort();
  speakToken++; try { speechSynthesis.cancel(); } catch(e) {}
  sess.phase = "recap"; sess.busy = false;
  if (!sess.recap) sess.recap = {loading:true};
  renderRecap();
  if (!sess.recap.loading) return;
  const mine = sess;
  setSelina("thinking");
  if (sess.test) sess.score = testScore(sess.results, sess.target);
  const prompt = `You are Selina, a German teacher. Below is the transcript of a short ${sess.lvl} session with a French-speaking learner.
Session: ${sessionTitle()}.${sess.test ? `\nThis was a test: the learner scored ${sess.score} % (${sess.results.filter(x => x === "correct").length} correct, ${sess.results.filter(x => x === "partial").length} partly correct, out of ${sess.target}). The pass mark is ${KINDS[sess.kind].pass} %. Base "stars" on the score.` : ""}
Write a short, encouraging review in French. Reply with only this JSON object:
{"stars": 1 to 3 (3 = most answers right, 2 = good effort with several mistakes, 1 = very hard), "bravo": "one warm sentence in French", "bravoDe": "the same idea in very simple German", "strengths": ["up to 3 things done well, in French"], "toWork": ["up to 3 short, concrete points to practise, in French, each with the correct German form"], "words": [{"de": "der Kaffee", "fr": "le café"}], "tip": "one practical tip for next time, in French"}
"words": up to 10 key words or expressions of this session, nouns with their article.

Transcript:
${transcript().slice(-12000)}`;
  try {
    const r = await sampleFn.json(prompt, {modelTier:"quick", cache:false});
    if (sess !== mine) return;
    const rec = {
      loading:false,
      stars:Math.max(1, Math.min(3, Math.round(Number(r && r.stars) || 2))),
      bravo:String(r && r.bravo || "Bravo pour cette séance !"), bravoDe:String(r && r.bravoDe || "Super gemacht!"),
      strengths:Array.isArray(r && r.strengths) ? r.strengths.map(String).slice(0,3) : [],
      toWork:Array.isArray(r && r.toWork) ? r.toWork.map(String).slice(0,3) : [],
      words:Array.isArray(r && r.words) ? r.words.filter(w => w && w.de).map(w => ({de:String(w.de), fr:String(w.fr||"")})).slice(0,10) : [],
      tip:String(r && r.tip || "")
    };
    sess.recap = rec;
    saveSession(rec);
    renderRecap();
    setSelina("happy");
    speak(rec.bravoDe);
  } catch(e){
    if (sess !== mine) return;
    sess.recap = {loading:false, failed:true};
    saveSession(null);
    renderRecap(); setSelina("idle");
  }
}
function saveSession(rec){
  if (sess.saved) return; sess.saved = true;
  const minutes = Math.max(1, Math.round((Date.now() - sess.start)/60000));
  state.minutes += minutes;
  const t = todayStr();
  const stars = rec ? rec.stars : 1;
  let xp = 30 + stars * 10;
  sess.newlyValidated = false;
  if (sess.unit){
    const us = state.units[sess.unit.id] || (state.units[sess.unit.id] = {steps:{}});
    const prev = us.steps[sess.kind] || {};
    if (sess.kind === "bilan"){
      const score = sess.score ?? testScore(sess.results, sess.target);
      us.steps.bilan = {score:Math.max(prev.score || 0, score), date:t, tries:(prev.tries || 0) + 1};
      if (score >= KINDS.bilan.pass && !us.validated){ us.validated = true; sess.newlyValidated = true; }
      xp = 20 + Math.round(score / 5) + (sess.newlyValidated ? 20 : 0);
    } else {
      us.steps[sess.kind] = {stars:Math.max(prev.stars || 0, stars), date:t};
      xp = 20 + stars * 10;
    }
  } else if (sess.kind === "examen"){
    const score = sess.score ?? testScore(sess.results, sess.target);
    const prev = state.exams[sess.lvl] || {};
    state.exams[sess.lvl] = {best:Math.max(prev.best || 0, score), passed:!!prev.passed || score >= KINDS.examen.pass, date:t};
    xp = 40 + Math.round(score / 2);
  } else if (sess.kind === "revision") state.lastRevision = t;
  sess.xpWon = xp;
  if (rec){
    rec.words.forEach(addWord);
    const mem = [...rec.toWork, ...state.memory.filter(m => !rec.toWork.includes(m))];
    state.memory = mem.slice(0, 8);
  }
  addXP(xp);
  state.sessions.unshift({d:t, id:sess.unit ? sess.unit.id + ":" + sess.kind : sess.topic ? "libre:" + sess.topic.id : sess.kind + ":" + sess.lvl, title:sessionTitle(), min:minutes, stars:rec ? rec.stars : null, score:sess.test ? sess.score : null});
  if (state.sessions.length > 60) state.sessions.length = 60;
  touch();
}

/* ---------- Entraînements : cartes, verbes, genre ---------- */
const NEW_PER_DAY = 10;
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const artHTML = c => c.g ? `<span class="g-${c.g}">${ART[c.g]}</span> ${esc(c.de)}` : esc(c.de);

function deck(){
  const lv = curLevel();
  const core = VOCAB.filter(v => v.lvl === "A1" || lv === "A2");
  const known = new Set(core.flatMap(v => [v.de.toLowerCase(), v.full.toLowerCase()]));
  const lena = state.words.filter(w => !known.has(w.de.toLowerCase())).map(w => {
    const m = w.de.match(/^(der|die|das) (.+)$/);
    return {id:"w:" + w.de, de:m ? m[2] : w.de, fr:w.fr, g:m ? {der:"m", die:"f", das:"n"}[m[1]] : null, full:w.de, lvl:"L", t:"lena"};
  });
  return [...lena, ...core].map(cardView);
}

const drillEl = document.getElementById("drill");
let drill = null;
function openDrill(d){
  unlockSpeech();
  drill = d;
  drillEl.hidden = false; document.body.classList.add("locked");
  renderDrill();
}
function closeDrill(){
  speakToken++; try { speechSynthesis.cancel(); } catch(e) {}
  drill = null; drillEl.hidden = true; drillEl.innerHTML = "";
  if (!sess) document.body.classList.remove("locked");
  touch(); renderHome();
}
function drillTop(title, sub, i, n){
  return `<header class="s-top">
    <button class="ico" data-a="drill-close" aria-label="Fermer">${ICON.close}</button>
    <div class="s-title"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
    <span class="timer">${n ? `${Math.min(i + 1, n)} / ${n}` : ""}</span>
  </header>
  <div class="s-prog" aria-hidden="true"><i style="width:${n ? Math.round(i / n * 100) : 0}%"></i></div>`;
}

/* Cartes */
function startCards(){
  const t = todayStr(), d = deck();
  const due = shuffle(d.filter(c => state.cards[c.id] && state.cards[c.id].due <= t)).slice(0, 40);
  const newLeft = Math.max(0, NEW_PER_DAY - (state.best.newDay === t ? state.best.newCount || 0 : 0));
  /* Les nouvelles cartes suivent le parcours : d'abord les mots vus avec Selina, puis ceux des unités commencées, puis les suivants */
  const started = new Set(UNITS.filter(u => Object.keys(unitState(u.id).steps).length).map(u => u.id));
  const rank = c => c.t === "lena" ? 0 : started.has(c.t) ? 1 : 2;
  const fresh = d.filter(c => !state.cards[c.id]).map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]).slice(0, newLeft);
  const q = []; let a = 0, b = 0;
  while (a < due.length || b < fresh.length){ if (a < due.length) q.push(due[a++].id); if (a < due.length) q.push(due[a++].id); if (b < fresh.length) q.push(fresh[b++].id); }
  if (!q.length){ toast("Tout est revu pour aujourd’hui"); return; }
  const byId = Object.fromEntries(d.map(c => [c.id, c]));
  openDrill({mode:"cards", q, byId, i:0, revealed:false, again:{}, dir:{}, stats:[0,0,0], xp:0, n0:q.length});
}
function cardFront(c){
  const s = state.cards[c.id];
  return (s && s.box >= 2) ? "fr" : "de";
}
function renderCards(){
  const d = drill;
  if (d.i >= d.q.length){
    drillEl.innerHTML = drillTop("Cartes", "Terminé", d.q.length, d.q.length) + `<div class="recap"><div class="in"><div class="head">
      <p class="eyebrow">Cartes du jour</p><h2 lang="de">Gut gemacht!</h2>
      <p>${d.stats[2]} sues, ${d.stats[1]} difficiles, ${d.stats[0]} à revoir. <b>+${d.xp} XP</b></p>
      <p class="meta">Les cartes difficiles reviennent demain, les autres plus tard : c’est le rythme qui fixe les mots.</p></div>
      <div class="actions"><button class="btn block" data-a="drill-close">Terminer</button></div></div></div>`;
    return;
  }
  const c = d.byId[d.q[d.i]];
  const s = state.cards[c.id];
  if (!d.dir[d.i]) d.dir[d.i] = cardFront(c);
  const front = d.dir[d.i];
  const label = c.t === "lena" ? "Vu avec Selina" : (THEMES[c.t] || "");
  const deSide = `<p class="fl-de" lang="de">${artHTML(c)}</p>`;
  const frSide = `<p class="fl-fr">${esc(c.fr)}</p>`;
  drillEl.innerHTML = drillTop("Cartes", `${d.q.length - d.i} restantes`, d.i, d.q.length) + `
  <div class="drill-body">
    <article class="flash">
      <div class="fl-top"><span class="eyebrow">${esc(label)}</span><span class="tag">${s ? `Niveau ${s.box} / 6` : "Nouvelle"}</span></div>
      <div class="fl-face">
        ${front === "de" ? deSide : frSide}
        ${front === "de" ? `<button class="ico" data-a="say" data-t="${esc(c.full)}" aria-label="Écouter">${ICON_SPEAK}</button>` : (c.g ? `<p class="meta">Avec l’article !</p>` : "")}
      </div>
      ${d.revealed ? `<div class="fl-answer">${front === "de" ? frSide : deSide}${c.de_de ? `<p class="meta">En Allemagne : ${esc(c.de_de)}</p>` : ""}
        ${front === "fr" ? `<div class="row"><button class="ico" data-a="say" data-t="${esc(c.full)}" aria-label="Écouter">${ICON_SPEAK}</button><button class="ico" data-a="say-slow" data-t="${esc(c.full)}" aria-label="Écouter lentement">${ICON_SLOW}</button></div>` : ""}
        ${c.g ? `<p class="meta">Nom ${({m:"masculin", f:"féminin", n:"neutre"})[c.g]}</p>` : ""}</div>` : ""}
    </article>
  </div>
  <footer class="drill-foot">
    ${d.revealed ? `<div class="grades">
      <button class="grade g0" data-a="grade" data-v="0"><b>À revoir</b><small>tout de suite</small></button>
      <button class="grade g1" data-a="grade" data-v="1"><b>Difficile</b><small>demain</small></button>
      <button class="grade g2" data-a="grade" data-v="2"><b>Je savais</b><small>${s ? `dans ${INTERVALS[Math.min(6, s.box + 1)]} j` : "demain"}</small></button>
    </div>` : `<button class="btn block" data-a="reveal">Voir la réponse</button>`}
  </footer>`;
  if (front === "de" && !d.revealed && !d.spoke){ d.spoke = true; speak(c.full); }
}
function gradeCard(g){
  const d = drill, id = d.q[d.i], t = todayStr();
  const isNew = !state.cards[id];
  const s = state.cards[id] || {box:0, due:t};
  if (g === 0){ s.box = 1; s.due = t; if ((d.again[id] || 0) < 2){ d.again[id] = (d.again[id] || 0) + 1; d.q.push(id); } }
  else if (g === 1){ s.box = Math.max(1, s.box); s.due = addDays(t, 1); }
  else { s.box = Math.min(6, s.box + 1); s.due = addDays(t, INTERVALS[s.box]); }
  state.cards[id] = s;
  if (isNew){ if (state.best.newDay !== t){ state.best.newDay = t; state.best.newCount = 0; } state.best.newCount++; }
  d.stats[g]++; d.xp++; addXP(1);
  d.i++; d.revealed = false; d.spoke = false;
  touch(); renderDrill();
}

const pronSay = p => ["ich","du","er","wir","ihr","sie"][p];

/* Verbes : quiz */
function makeVerbQs(only){
  const lv = curLevel();
  const pool = only ? [only] : VERBS.filter(v => !v.lvl || lv === "A2");
  const qs = [];
  for (let k = 0; k < 10; k++){
    const v = pick(pool), p = Math.floor(Math.random() * 6);
    const pron = p === 2 ? pick(["er","Selina"]) : p === 5 ? pick(["Sie","sie"]) : ["ich","du","","wir","ihr"][p];
    const hintP = pron === "sie" ? " (ils)" : pron === "Sie" ? " (vous, poli)" : "";
    if (lv === "A2" && v.pp && Math.random() < 0.4){
      const right = perfekt(v, p);
      const other = v.aux === "haben" ? "sein" : "haben";
      const stem = v.inf.replace(/e?n$/, "");
      let wrongPP = "ge" + stem + "t"; if (wrongPP === v.pp) wrongPP = "ge" + v.inf;
      const opts = shuffle([...new Set([right, `${AUX[other][p]} ${v.pp}`, `${AUX[v.aux][p]} ${wrongPP}`, `${AUX[other][p]} ${wrongPP}`])]);
      qs.push({pron, hint:`${v.inf} · passé composé${hintP}`, opts, ans:opts.indexOf(right), say:`${pron} ${right}`});
    } else {
      const right = v.f[p];
      const others = shuffle([...new Set(v.f.filter(f => f !== right))]).slice(0, 3);
      const opts = shuffle([right, ...others]);
      qs.push({pron, hint:`${v.inf} · ${v.fr}${hintP}`, opts, ans:opts.indexOf(right), say:`${pron} ${right}`});
    }
  }
  return qs;
}
function startVerbQuiz(inf){
  const only = inf ? VERBS.find(v => v.inf === inf) : null;
  openDrill({mode:"quiz", kind:"verbs", title:only ? `Quiz : ${only.inf}` : "Quiz des verbes", qs:makeVerbQs(only), i:0, chosen:null, score:0, xp:0, only:inf || null});
}

/* Genre */
function startGenre(){
  const nouns = shuffle(deck().filter(c => c.g && c.g !== "p")).slice(0, 12);
  const qs = nouns.map(c => ({noun:c, opts:["der","die","das"], ans:["m","f","n"].indexOf(c.g), say:c.full}));
  openDrill({mode:"quiz", kind:"genre", title:"Der, die ou das ?", qs, i:0, chosen:null, score:0, xp:0});
}
function genreTip(c){
  const w = c.de.toLowerCase();
  if (/(ung|heit|keit|ion)$/.test(w)) return "Les noms en -ung, -heit, -keit, -ion sont toujours féminins.";
  if (/(chen|lein)$/.test(w)) return "Les noms en -chen et -lein sont toujours neutres.";
  if (c.t === "woche" && c.g === "m") return "Les jours, les mois et les saisons sont masculins.";
  if (/e$/.test(w) && c.g === "f") return "Beaucoup de noms en -e sont féminins.";
  return "Apprenez le nom avec son article, comme un seul mot.";
}

function renderQuiz(){
  const d = drill;
  const n = d.qs.length;
  if (d.i >= n){
    let rec = false;
    if (d.kind === "fiche"){ const st = grammarState(d.gid); rec = st.best === undefined || d.score > st.best; if (rec){ state.grammar[d.gid] = {...st, read:true, best:d.score}; } }
    else { const best = d.kind === "genre" ? "genre" : "verbs"; rec = d.score > (state.best[best] || 0) && !d.only; if (rec) state.best[best] = d.score; }
    drillEl.innerHTML = drillTop(d.title, "Terminé", n, n) + `<div class="recap"><div class="in"><div class="head">
      <p class="eyebrow">${esc(d.title)}</p><h2 lang="de">${d.score >= n * 0.8 ? "Super!" : d.score >= n * 0.5 ? "Gut gemacht!" : "Weiter so!"}</h2>
      <p class="score">${d.score} / ${n}</p>
      <p>${rec ? "Nouveau record. " : ""}<b>+${d.xp} XP</b></p></div>
      <div class="actions">${d.kind === "bern" ? `<button class="btn block" data-a="bern-quiz">Rejouer</button><button class="btn ghost block" data-a="bern" data-v="">Revoir les expressions</button>` : d.kind === "fiche" ? `<button class="btn block" data-a="fiche-quiz" data-v="${d.gid}">Rejouer</button><button class="btn ghost block" data-a="fiche" data-v="${d.gid}">Revoir la fiche</button>` : `<button class="btn block" data-a="${d.kind === "genre" ? "genre" : d.only ? "vquiz-one" : "vquiz"}"${d.only ? ` data-v="${esc(d.only)}"` : ""}>Rejouer</button>`}<button class="btn ghost block" data-a="drill-close">Terminer</button></div></div></div>`;
    return;
  }
  const q = d.qs[d.i], done = d.chosen !== null;
  let prompt;
  if (d.kind === "bern") prompt = `<p class="eyebrow center">Que veut dire…</p><p class="q-mid">« ${esc(q.text)} »</p>`;
  else if (d.kind === "fiche") prompt = `<p class="q-mid" lang="de">${esc(q.text)}</p>`;
  else if (d.kind === "genre") prompt = `<p class="q-big" lang="de"><span class="blank">${done ? `<span class="g-${q.noun.g}">${ART[q.noun.g]}</span>` : "&nbsp;"}</span> ${esc(q.noun.de)}</p><p class="meta">${esc(q.noun.fr)}</p>`;
  else prompt = `<p class="q-big" lang="de">${esc(q.pron)} <span class="blank">${done ? esc(q.opts[q.ans]) : "&nbsp;"}</span></p><p class="meta">${esc(q.hint)}</p>`;
  drillEl.innerHTML = drillTop(d.title, `${d.score} bonne${d.score>1?"s":""} réponse${d.score>1?"s":""}`, d.i, n) + `
  <div class="drill-body">
    <article class="flash quiz">
      ${prompt}
      <div class="qopts ${d.kind === "genre" ? "three" : ""}">${q.opts.map((o, k) => {
        const cls = done ? (k === q.ans ? " ok" : (k === d.chosen ? " ko" : "")) : "";
        const gcl = d.kind === "genre" ? ` art-${["m","f","n"][k]}` : "";
        return `<button class="opt${gcl}${cls}" data-a="qopt" data-k="${k}"${done ? " disabled" : ""} lang="de">${esc(o)}</button>`; }).join("")}</div>
      ${done ? `<p class="explain">${d.chosen === q.ans ? "Richtig !" : "Pas tout à fait."} ${d.kind === "genre" ? esc(genreTip(q.noun)) : (d.kind === "fiche" || d.kind === "bern") ? esc(q.explain) : `On dit : <b lang="de">${esc(q.say)}</b>.`}</p>` : ""}
    </article>
  </div>
  <footer class="drill-foot">${done ? `<button class="btn block" data-a="qnext">${d.i + 1 < n ? "Suivant" : "Voir le résultat"}</button>` : `<p class="meta center">Touchez la bonne réponse.</p>`}</footer>`;
}
function answerQuiz(k){
  const d = drill, q = d.qs[d.i]; if (d.chosen !== null) return;
  d.chosen = k;
  if (k === q.ans){ d.score++; const pts = d.kind === "genre" ? 1 : 2; d.xp += pts; addXP(pts); }
  if (q.say) speak(q.say);
  renderDrill();
}
function nextQuiz(){ drill.i++; drill.chosen = null; renderDrill(); }
