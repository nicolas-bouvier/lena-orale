      </div>
      ${d.bern ? `<div class="bern-card"><span class="eyebrow">À Berne, on dit</span><b>${esc(d.bern.be)}</b><span>${esc(d.bern.de)}${d.bern.fr ? " · " + esc(d.bern.fr) : ""}</span></div>` : ""}
      ${d.rule ? `<div class="rule-card"><span class="eyebrow">La règle · ${esc(d.rule.title)}</span><p>${esc(d.rule.text)}</p></div>` : ""}
      ${m.why ? whyHTML(m.why) : ""}
      ${d.exercise ? exerciseHTML(d.exercise, i) : ""}
      </div>`;
    }
  });
  if (sess.busy) html += sess.preview ? `<div class="msg lena-msg"><div class="say"><p class="de" lang="de">${esc(sess.preview)}</p><div class="typing-inline" aria-hidden="true"><i></i><i></i><i></i></div></div></div>` : `<div class="typing" aria-label="Selina écrit"><i></i><i></i><i></i></div>`;
  if (sess.error) html += `<div class="notice"><b>${esc(sess.error.msg)}</b>${sess.error.retry ? `<div class="row" style="margin-top:10px"><button class="btn small" data-a="retry">Redemander à Selina</button></div>` : ""}</div>`;
  if (sess.ended && !sess.busy) html += `<button class="btn block" data-a="recap">Voir mon bilan</button>`;
  chat.innerHTML = html; swiss(chat);
  chat.scrollTop = chat.scrollHeight;
}
/* « Pourquoi ? » : Selina décortique la phrase, mot par mot, en français */
function whyHTML(w){
  if (w.loading) return `<div class="why-card"><span class="eyebrow">Pourquoi ?</span><p class="meta">Selina décortique la phrase…</p></div>`;
  if (w.error) return `<div class="why-card"><span class="eyebrow">Pourquoi ?</span><p class="meta">${esc(w.error)}</p></div>`;
  const d = w.data;
  return `<div class="why-card"><span class="eyebrow">Pourquoi ?</span>
    ${d.parts.length ? `<div class="parts">${d.parts.map(p => `<div class="part"><b lang="de">${esc(p.de)}</b><span>${esc(p.fr)}</span>${p.role ? `<small>${esc(p.role)}</small>` : ""}</div>`).join("")}</div>` : ""}
    ${d.rules.map(r => `<div class="why-rule"><b>${esc(r.title)}</b><p>${esc(r.text)}</p></div>`).join("")}
    ${d.trap ? `<p class="why-trap"><b>Le piège :</b> ${esc(d.trap)}</p>` : ""}
  </div>`;
}
async function explainWhy(i){
  const m = sess && sess.log[i]; if (!m || !sampleFn) return;
  if (m.why && m.why.error) m.why = null;
  if (m.why && m.why.loading) return;
  if (m.why){ m.whyHidden = !m.whyHidden; const keep = m.why; m.why = m.whyHidden ? null : keep; m.whyCache = keep; renderChat(); return; }
  if (m.whyCache){ m.why = m.whyCache; m.whyHidden = false; renderChat(); return; }
  const sentence = m.t === "me" ? m.correction.right : m.d.de;
  const ctx = m.t === "me" ? `The learner wrote: "${m.text}". The correct form is: "${m.correction.right}". First explain clearly why the learner's version is wrong, then why the correct one is built this way.` : "";
  m.why = {loading:true}; renderChat();
  const mine = sess;
  try {
    const r = await sampleFn.json(`You are a patient German teacher. Explain to a French-speaking learner who starts from zero (no grammar knowledge) WHY this German sentence is built the way it is: "${sentence}". ${ctx}
Reply with only this JSON object:
{"parts": [{"de": "a word or a group of words (keep an article with its noun)", "fr": "its meaning in French", "role": "a very short grammar note in French, e.g. \"verbe conjugué avec du : terminaison -st\", \"2e position : toujours le verbe\", \"accusatif masculin : ein devient einen\", or empty"}], "rules": [{"title": "short title in French", "text": "1 or 2 simple sentences in French; explain any technical word in passing"}], "trap": "one typical mistake a French speaker would make with this sentence, in French, or empty"}
At most 3 rules, the most useful ones. Simple, friendly French, no jargon without explanation.`, {modelTier:"quick"});
    if (sess !== mine) return;
    const parts = Array.isArray(r && r.parts) ? r.parts.filter(p => p && p.de).map(p => ({de:String(p.de), fr:String(p.fr || ""), role:String(p.role || "")})).slice(0, 14) : [];
    const rules = Array.isArray(r && r.rules) ? r.rules.filter(x => x && x.text).map(x => ({title:String(x.title || ""), text:String(x.text)})).slice(0, 3) : [];
    m.why = {data:{parts, rules, trap:String(r && r.trap || "")}};
  } catch(e){
    if (sess !== mine) return;
    m.why = {error:e && e.code === "rate_limited" ? "Trop de demandes d’un coup : réessayez dans un moment." : "Selina n’a pas pu expliquer cette phrase. Touchez à nouveau « Pourquoi ? »."};
    m.whyCache = null;
  }
  const c = document.getElementById("chat"); const keep = c ? c.scrollTop : 0; renderChat(); if (c) c.scrollTop = keep;
}
function exerciseHTML(ex, i){
  const done = ex.chosen !== null;
  return `<div class="ex"><span class="eyebrow">Petit exercice</span><p class="q">${esc(ex.question)}</p>
    <div class="opts">${ex.options.map((o, k) => {
      const cls = done ? (k === ex.answer ? " ok" : (k === ex.chosen ? " ko" : "")) : "";
      return `<button class="opt${cls}" data-a="opt" data-i="${i}" data-k="${k}"${done?" disabled":""} lang="de">${esc(o)}</button>`; }).join("")}</div>
    ${done ? `<p class="explain">${ex.chosen === ex.answer ? "Richtig ! " : "Pas tout à fait. "}${esc(ex.explain)}</p>` : ""}
  </div>`;
}
function renderSuggest(){
  const el = document.getElementById("suggest"); if (!el || !sess) return;
  el.innerHTML = sess.busy || sess.ended ? "" : sess.suggestions.map(s => `<button class="chip" data-a="chip" data-t="${esc(s)}" lang="de">${esc(s)}</button>`).join("");
}

/* ---------- Bilan ---------- */
function renderRecap(){
  const convo = document.getElementById("convo"); if (!convo) return;
  const r = sess.recap;
  const next = nextStep(sess.lvl);
  const K = KINDS[sess.kind];
  const passed = sess.test && sess.score >= K.pass;
  let body;
  if (r.loading) body = `<div class="head"><p class="eyebrow">Bilan</p><h2>Selina relit la séance…</h2><p class="meta">Quelques secondes.</p></div>`;
  else if (r.failed) body = `<div class="head"><p class="eyebrow">Bilan</p><h2>Séance enregistrée.</h2><p class="meta">Selina n’a pas pu écrire le bilan cette fois. Vos minutes, vos points et votre leçon sont bien comptés.</p></div>
    <div class="actions"><button class="btn block" data-a="home">Retour à l’accueil</button></div>`;
  else body = `
    <div class="head"><p class="eyebrow">${sess.test ? "Résultat" : "Bilan de la séance"} · ${esc(sessionTitle())}</p>
    ${sess.test ? `<p class="score">${sess.score} %</p><p class="verdict ${passed ? "ok" : "ko"}">${sess.kind === "bilan" ? (passed ? (sess.newlyValidated ? "Unité validée !" : "Réussi, unité déjà validée.") : `Pas encore : il faut ${K.pass} % pour valider l’unité.`) : (passed ? `Examen blanc ${sess.lvl} réussi !` : `Pas encore : il faut ${K.pass} % pour réussir l’examen.`)}</p>` : `<div class="big-stars" aria-label="${r.stars} étoiles sur 3">${starsHTML(r.stars)}</div>`}
    <h2 lang="de">${esc(r.bravoDe)}</h2>
    <p>${esc(r.bravo)}</p>
    <p class="xp-won">+${sess.xpWon || 0} XP</p></div>
    ${r.strengths.length ? `<div class="card"><h3>Ce qui va bien</h3><ul>${r.strengths.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
    ${r.toWork.length ? `<div class="card"><h3>À travailler</h3><ul>${r.toWork.map(s => `<li>${esc(s)}</li>`).join("")}</ul><p class="meta" style="margin-top:8px">Selina s’en souviendra à la prochaine séance.</p></div>` : ""}
    ${r.words.length ? `<div><h3>Les mots de la séance</h3><p class="meta" style="margin-bottom:8px">Ils rejoignent vos cartes à mémoriser.</p><div class="words">${r.words.map(w => `<div class="word"><button class="ico sm" data-a="say" data-t="${esc(w.de)}" aria-label="Écouter ${esc(w.de)}">${ICON_SPEAK}</button><span class="w"><b lang="de">${esc(w.de)}</b><span>${esc(w.fr)}</span></span></div>`).join("")}</div></div>` : ""}
    ${r.tip ? `<p class="notice"><b>Conseil :</b> ${esc(r.tip)}</p>` : ""}
    <div class="actions">
      ${sess.kind === "bilan" && !passed ? `<button class="btn block" data-a="step" data-id="${sess.unit.id}" data-k="pratiquer">Retravailler : S’entraîner</button><button class="btn ghost block" data-a="step" data-id="${sess.unit.id}" data-k="bilan">Retenter le bilan</button>`
        : next ? `<button class="btn block" data-a="step" data-id="${next.unit.id}" data-k="${next.kind}">Continuer : ${esc(KINDS[next.kind].fr)} · ${esc(next.unit.fr)}</button>` : ""}
      <button class="btn ghost block" data-a="home">Retour à l’accueil</button>
    </div>`;
  convo.innerHTML = `<div class="recap"><div class="in">${body}</div></div>`; swiss(convo);
  setStatus(r.loading ? "Selina relit la séance…" : "Bis bald!", r.loading ? "" : "go");
  updateTimer();
}
function closeSession(){
  if (sess && sess.ctl) sess.ctl.abort();
  speakToken++; try { speechSynthesis.cancel(); } catch(e) {}
  sess = null; clearInterval(tick);
  sessEl.hidden = true; sessEl.innerHTML = "";
  if (!drill) document.body.classList.remove("locked");
  renderHome();
}

/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "tab"){ tab = b.dataset.v; try { localStorage.setItem(LOCAL_KEY + ".tab", tab); } catch(err) {} renderHome(); window.scrollTo(0, 0); }
  else if (a === "step"){ if (sess) closeSession(); startSession(b.dataset.k, b.dataset.id); }
  else if (a === "topic") startSession("libre", b.dataset.id);
  else if (a === "revision"){ if (sess) closeSession(); startSession("revision", curLevel()); }
  else if (a === "examen"){ if (sess) closeSession(); startSession("examen", curLevel()); }
  else if (a === "level"){ state.settings.level = b.dataset.v; touch(); if (b.closest(".hero")) tab = "path"; renderHome(); }
  else if (a === "say") speak(b.dataset.t);
  else if (a === "say-slow") speak(b.dataset.t, {slow:true});
  else if (a === "replay" || a === "replay-slow"){ const last = sess && [...sess.log].reverse().find(m => m.t === "lena"); if (last) speak(last.d.de, {slow:a === "replay-slow"}); }
  else if (a === "why") explainWhy(+b.dataset.i);
  else if (a === "fiche") openFiche(b.dataset.v);
  else if (a === "bern") openBern(b.dataset.v || null);
  else if (a === "bern-quiz") startBernQuiz();
  else if (a === "region"){ state.settings.region = b.dataset.v; touch(); renderHome(); }
  else if (a === "fiche-quiz") startFicheQuiz(b.dataset.v);
  else if (a === "fr"){ const m = sess && sess.log[+b.dataset.i]; if (m){ m.fr = !m.fr; const c = document.getElementById("chat"); const keep = c.scrollTop; renderChat(); c.scrollTop = keep; } }
  else if (a === "chip"){ const t = document.getElementById("reply"); if (t){ t.value = b.dataset.t; autoGrow(t); t.focus(); } speak(b.dataset.t); }
  else if (a === "idk") sendReply("Ich weiß nicht… (je ne sais pas quoi dire, aide-moi)");
  else if (a === "tip"){ const t = document.getElementById("tip"); if (t) t.hidden = !t.hidden; }
  else if (a === "opt") answerExercise(+b.dataset.i, +b.dataset.k);
  else if (a === "retry"){ if (sess && !sess.busy) callSelina(); }
  else if (a === "quit"){ if (!sess) return; if (sess.phase === "recap" || sess.n < 2) closeSession(); else openRecap(); }
  else if (a === "recap") openRecap();
  else if (a === "home") closeSession();
  else if (a === "cards") startCards();
  else if (a === "verb") openVerb(b.dataset.v);
  else if (a === "vquiz") startVerbQuiz(null);
  else if (a === "vquiz-one") startVerbQuiz(b.dataset.v);
  else if (a === "genre") startGenre();
  else if (a === "drill-close") closeDrill();
  else if (a === "reveal"){ if (drill){ drill.revealed = true; renderDrill(); if (drill.dir[drill.i] === "fr") speak(drill.byId[drill.q[drill.i]].full); } }
  else if (a === "grade") gradeCard(+b.dataset.v);
  else if (a === "qopt") answerQuiz(+b.dataset.k);
  else if (a === "qnext") nextQuiz();
  else if (a === "fact-del"){ (state.profile.facts || []).splice(+b.dataset.i, 1); touch(); renderHome(); }
  else if (a === "goal"){ state.settings.goal = +b.dataset.v; touch(); renderHome(); }
  else if (a === "rate"){ state.settings.rate = +b.dataset.v; touch(); renderHome(); speak("So klingt meine Stimme."); }
  else if (a === "showfr"){ state.settings.showFr = b.dataset.v === "1"; touch(); renderHome(); }
  else if (a === "reset"){
    document.getElementById("resetRow").innerHTML = `<span class="meta">Effacer leçons, points, cartes et souvenirs de Selina ?</span><button class="btn small" data-a="reset-yes">Oui, tout effacer</button><button class="btn ghost small" data-a="reset-no">Annuler</button>`;
  }
  else if (a === "reset-yes"){ const keep = {profile:state.profile, settings:state.settings}; state = {...defaultState(), ...keep}; touch(); renderHome(); }
  else if (a === "reset-no") renderHome();
});
document.addEventListener("submit", e => {
  if (e.target.id === "sayform"){ e.preventDefault(); sendReply(document.getElementById("reply").value); }
});
function autoGrow(t){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }
document.addEventListener("keydown", e => {
  if (e.target.id === "reply" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendReply(e.target.value); return; }
  if (!drill || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (drill.mode === "cards" && drill.i < drill.q.length){
    if (!drill.revealed && (e.key === " " || e.key === "Enter")){ e.preventDefault(); drill.revealed = true; renderDrill(); }
    else if (drill.revealed && ["1","2","3"].includes(e.key)) gradeCard(+e.key - 1);
  } else if (drill.mode === "quiz" && drill.i < drill.qs.length){
    if (drill.chosen === null && /^[1-4]$/.test(e.key) && +e.key <= drill.qs[drill.i].opts.length) answerQuiz(+e.key - 1);
    else if (drill.chosen !== null && e.key === "Enter"){ e.preventDefault(); nextQuiz(); }
  }
  if (e.key === "Escape") closeDrill();
});
let profileTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "reply") autoGrow(e.target);
  if (e.target.id === "pname" || e.target.id === "pwork"){
    state.profile.name = document.getElementById("pname").value.trim();
    state.profile.work = document.getElementById("pwork").value.trim();
    clearTimeout(profileTimer); profileTimer = setTimeout(touch, 800);
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "gkey"){ gSetKey(e.target.value.trim()); location.reload(); return; }
  if (e.target.id === "voice"){ state.settings.voice = e.target.value; touch(); speak("Hallo! Ich bin Selina."); }
});

/* ---------- Démarrage ---------- */
let voicesChecked = false;
if ("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", () => { loadVoices(); if (!sess && !drill) renderHome(); });
  setTimeout(() => { voicesChecked = true; loadVoices(); if (!sess && !drill) renderHome(); }, 1500);
}
renderHome();

/* Les images de Selina, gardées dans le téléphone (la même mémoire que « Parler avec Selina ») */
(function loadFace(){
  try {
    const r = indexedDB.open("lena-orale", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => {
      const db = r.result; if (!db.objectStoreNames.contains("files")) return;
      const st = db.transaction("files").objectStore("files"), got = {};
      let n = 0;
      ["smile","talk","blink"].forEach(k => { const q = st.get("face_" + k); q.onsuccess = () => { if (q.result) got[k] = URL.createObjectURL(q.result); if (++n === 3 && got.smile && got.talk && got.blink){ faceUrls = got; if (!sess && !drill) renderHome(); } }; });
    };
  } catch(e) {}
})();

(async () => {
  if (!window.claude || typeof window.claude.use !== "function"){ sampleState = "absent"; renderHome(); return; }
  claude.use("sample").then(s => { sampleFn = s; sampleState = s ? "ok" : "absent"; if (!sess && !drill) renderHome(); });
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    remoteRef = ref; syncMode = "compte";
    if (snap.exists){
      const remote = normalize(snap.data());
      if ((remote.updatedAt||0) >= (state.updatedAt||0)){
        state = remote;
        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e) {}
      } else flushRemote();
    } else if (state.updatedAt > 0) flushRemote();
    if (!sess && !drill) renderHome();
  } catch(e) { syncMode = "local"; }
})();
</script>
